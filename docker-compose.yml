services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edunex_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=student_ai_system
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./python/output:/var/www/html/python/output
      - ./uploads:/var/www/html/uploads

  db:
    image: mysql:8.0
    container_name: edunex_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: student_ai_system
    ports:
      - "3306:3306"
    volumes:
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
      - edunex_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edunex_db_data:
