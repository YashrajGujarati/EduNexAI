# Nixpacks configuration for Railway when deployed without Docker
[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.mysqli",
  "php82Extensions.pdo_mysql",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "python311",
  "python311Packages.pip"
]

[phases.install]
cmds = [
  "pip install pandas scikit-learn mysql-connector-python seaborn matplotlib --break-system-packages"
]

[start]
cmd = "php -S 0.0.0.0:${PORT:-8000}"
