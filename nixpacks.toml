# Nixpacks configuration for Railway (fallback when not using Docker)
[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.mongodb",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "python311",
  "python311Packages.pip"
]

[phases.install]
cmds = [
  "pip install pandas scikit-learn pymongo seaborn matplotlib --break-system-packages"
]

[start]
cmd = "php -S 0.0.0.0:${PORT:-8000}"
